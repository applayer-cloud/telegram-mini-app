<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>applayer.cloud — Source Code Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Inter, sans-serif;
      }
    </style>
  </head>
  <body class="bg-white text-black">
    <!-- CONFIG -->
    <script>
      const TELEGRAM_USERNAME = "mrachmatriadi";

      function buyProduct(productName) {
        const message = encodeURIComponent(
          "Hello, I want to buy: " + productName,
        );
        const url = `https://t.me/${TELEGRAM_USERNAME}?text=${message}`;
        window.open(url, "_blank");
      }

      function changeImage(target, src) {
        document.getElementById(target).src = src;
      }
    </script>

    <!-- NAVBAR -->
    <header class="border-b">
      <div class="max-w-6xl mx-auto flex justify-between items-center p-5">
        <div class="font-bold text-xl">applayer.cloud</div>
        <nav class="space-x-8 text-sm">
          <a
            href="https://t.me/mrachmatriadi"
            class="border px-4 py-2 rounded-lg hover:bg-black hover:text-white"
            >Contact</a
          >
        </nav>
      </div>
    </header>

    <!-- HERO -->
    <section class="max-w-6xl mx-auto text-center py-28 px-6">
      <h1 class="text-5xl font-bold mb-6">Ready-to-Use Source Code</h1>
      <p class="text-gray-600 max-w-xl mx-auto mb-10">
        High quality source code for developers and businesses.
      </p>
      <a
        href="#products"
        class="border px-8 py-4 rounded-xl hover:bg-black hover:text-white transition"
        >Browse Products</a
      >
    </section>

    <!-- PRODUCTS -->
    <section id="products" class="max-w-6xl mx-auto py-20 px-6">
      <div class="grid md:grid-cols-3 gap-10">
        <div class="border rounded-2xl p-6 hover:shadow-lg transition">
          <img src="https://placehold.co/600x400" class="rounded-xl mb-4" />
          <h3 class="font-semibold text-lg mb-2">
            <a href="/product-sso.html" class="text-sm underline"
              >SSO Starter Project</a
            >
          </h3>
          <p class="text-sm text-gray-600 mb-4">
            Single Sign-On starter project.
          </p>
          <div class="flex justify-between items-center">
            <button
              onclick="buyProduct('SSO Starter Project')"
              class="border px-6 py-3 rounded-xl hover:bg-black hover:text-white"
            >
              Buy or Ask
            </button>
            <span class="font-semibold">$25</span>
          </div>
        </div>
      </div>
    </section>

    <footer class="py-10 text-center text-sm text-gray-500">
      © 2026 applayer.cloud — All rights reserved
    </footer>
  </body>
</html>
